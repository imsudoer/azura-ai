[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "azura-ai"
version = "0.1.0"
description = "Telegram userbot acting as a believable digital human"
requires-python = ">=3.12"
readme = "README.md"
authors = [{ name = "OnlySq" }]
dependencies = [
  "kurigram>=2.2.0",
  "tgcrypto-pyrofork>=1.2.7",
  "sqlalchemy>=2.0.36",
  "aiosqlite>=0.20.0",
  "sqlite-vec>=0.1.6",
  "pydantic>=2.9.2",
  "pydantic-settings>=2.6.1",
  "httpx>=0.27.2",
  "openai>=1.55.0",
  "jinja2>=3.1.4",
  "loguru>=0.7.2",
  "python-dotenv>=1.0.1",
  "prompt-toolkit>=3.0.48",
  "rich>=13.9.4",
  "orjson>=3.10.11",
  "numpy>=2.1.3",
  "python-magic-bin>=0.4.14; sys_platform == 'win32'",
  "python-magic>=0.4.27; sys_platform != 'win32'",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.3",
  "pytest-asyncio>=0.24.0",
  "pytest-cov>=6.0.0",
  "hypothesis>=6.118.7",
  "ruff>=0.7.4",
]

[project.scripts]
azura = "azura.run:main"
azura-init = "azura.init_personality:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["azura*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "ASYNC"]
ignore = ["E501"]
